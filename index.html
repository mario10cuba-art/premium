<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Masivo de Anuncios v7 - Textos IA & Optimización</title>
    <!-- Icono de Robot -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <style>
        :root {
            --primary: #0284c7; --primary-dark: #0369a1; --accent: #f59e0b;
            --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1;
        }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); padding: 16px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btn { background-color: var(--primary); color: white; border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-bottom: 8px; transition: 0.2s; }
        .btn:active { background-color: var(--primary-dark); }
        .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .btn-success { background-color: #16a34a; }
        .btn-purple { background-color: #8b5cf6; }
        .btn-purple:hover { background-color: #7c3aed; }
        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-danger { background-color: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 10px; }
        .btn-sm { padding: 6px 10px; font-size: 0.8rem; background: #475569; color: white; border: none; border-radius: 4px; cursor: pointer; }
        input[type="file"] { display: none; }
        .file-upload-btn { background-color: #e0f2fe; color: var(--primary-dark); border: 2px dashed var(--primary); padding: 16px; border-radius: 8px; text-align: center; font-weight: 600; display: block; cursor: pointer; margin-bottom: 8px; }
        .file-import-btn { background-color: #fef08a; color: #854d0e; border: 2px dashed #eab308; padding: 10px; border-radius: 8px; text-align: center; font-weight: 600; display: block; cursor: pointer; margin-bottom: 16px; }
        textarea, input[type="text"], input[type="number"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; margin-top: 4px; margin-bottom: 12px; font-family: inherit; }
        label { font-size: 0.85rem; font-weight: 700; color: #475569; display: block; }
        
        .product-list-item { display: flex; gap: 15px; background: white; border-radius: 8px; border: 1px solid #e2e8f0; padding: 12px; margin-bottom: 12px; align-items: flex-start; transition: all 0.3s ease; }
        .product-list-item.linked { border-color: #16a34a; background-color: #f0fdf4; }
        
        .img-container { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
        .product-list-item img { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; background: #f1f5f9; }
        .no-img-box { width: 90px; height: 90px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 10px; text-align: center; border-radius: 6px; color: #64748b; }
        
        .product-details { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }
        .row-flex { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        #loadingOverlay { display: none; text-align: center; padding: 15px; font-weight: 600; color: var(--primary-dark); background: #e0f2fe; border-radius: 8px; margin-bottom: 16px; border: 2px solid var(--primary); }
        #searchBar { border: 2px solid var(--primary); padding: 10px; font-size: 16px; font-weight: bold; width: 100%; box-sizing: border-box; margin-bottom: 15px; }
        
        .pre-search-container { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; }
        .pre-search-container input { margin: 0; flex: 1; }
        .status-badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-pending { background: #e2e8f0; color: #475569; }
        .badge-linked { background: #dcfce7; color: #15803d; }
        .badge-antispam { background: #fef08a; color: #854d0e; }
        .badge-vision { background: #e0e7ff; color: #4338ca; }

        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 99999; }
        #appScreen { display: none; }
        
        .user-bar { background: #1e293b; color: white; padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: bold; }
        .user-bar .quota { background: #f59e0b; padding: 2px 8px; border-radius: 4px; color: #fff; }
        .logout-btn { background: #ef4444; border: none; color: white; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="card" style="width: 100%; max-width: 350px; text-align: center; border-color: var(--primary); padding: 30px 20px;">
        <img src="https://i.postimg.cc/JzNwmDrB/photostudio-1789810734924.jpg" alt="Logo" style="height:50px; margin-bottom: 20px;">
        <h2 style="margin-top: 0; color: var(--primary-dark);">Acceso al Sistema</h2>
        <input type="text" id="username" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button class="btn" id="btnLogin" onclick="iniciarSesion()">Iniciar Sesión</button>
        <div id="loginError" style="color: #ef4444; font-size: 0.85rem; margin-top: 10px; font-weight: 600; min-height: 20px;"></div>
    </div>
</div>

<div id="appScreen" class="container">
    
    <div class="user-bar">
        <div>👤 <span id="lblUsername">---</span></div>
        <div>🔋 Cuota: <span id="lblQuota" class="quota">0</span> usos</div>
        <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
    </div>

    <div class="card" style="margin-bottom: 16px; border-color: #0284c7;">
        <div style="display:flex; flex-direction:column; gap:10px; box-sizing:border-box;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <img src="https://i.postimg.cc/JzNwmDrB/photostudio-1789810734924.jpg" alt="SHEKINAHIA Logo" style="height:48px; width:auto; max-width:180px; object-fit:contain; border-radius:6px;">
                <div style="display:flex; align-items:center; gap:6px;">
                    <span style="background:#e0f2fe; color:#0369a1; font-size:12px; font-weight:bold; padding:4px 10px; border-radius:6px; border:1px solid rgba(2,132,199,0.2);">
                        🤖 Gestor Masivo 🔥
                    </span>
                </div>
            </div>
            <div style="background:#f0fdf4; color:#166534; font-size:11px; font-weight:600; padding:8px 12px; border-radius:8px; border:1px solid #bbf7d0; text-align:center; word-break:break-word;">
                💳 <b>Donaciones CUP:</b> 9227-9598-7218-2212
            </div>
        </div>
    </div>

    <div class="card">
        <label class="file-import-btn" for="importJsonInput">📂 Importar JSON Previamente Exportado</label>
        <input type="file" id="importJsonInput" accept=".json" onchange="importarJSON(event)">

        <label>Subir Fotos Nuevas</label>
        <label for="fileInput" class="file-upload-btn" id="fileLabel">Elegir archivos (0 seleccionados)</label>
        <input type="file" id="fileInput" multiple accept="image/*">
        
        <label style="margin-top: 12px;">Lista de Productos con Precios</label>
        
        <div class="pre-search-container">
            <input type="text" id="preSearch" placeholder="Ej. Acetaminofen">
            <button class="btn-sm" style="background:var(--primary);" onclick="buscarEnTexto()">🔍 Buscar</button>
            <button class="btn-sm" style="background:#ef4444;" onclick="removerDelTexto()">🗑️ Eliminar</button>
        </div>
        
        <textarea id="rawProducts" style="height:120px;">$ 2.50 USD :
Gel Analgésico Oral
Alivio Urinario (8 tabletas)</textarea>

        <div style="margin-top: 6px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="applyMarketing" style="width: 18px; height: 18px; cursor: pointer; margin: 0;">
            <label for="applyMarketing" style="margin: 0; cursor: pointer; font-size: 0.85rem;">Aplicar regla de marketing a los títulos</label>
        </div>

        <div>
            <label>Límite caracteres descripción</label>
            <input type="number" id="limiteDesc" placeholder="Ej. 300">
        </div>

        <div class="grid-2">
            <div><label>Provincia</label><input type="text" id="provincia" value="La Habana"></div>
            <div><label>Municipio</label><input type="text" id="municipio" value="Arroyo Naranjo"></div>
            <div><label>Teléfono</label><input type="number" id="telefono" placeholder="Ej. 55555555" value="59217208"></div>
        </div>

        <button class="btn" id="processBtn" onclick="procesarAnuncios()">1. Vincular Fotos a Lista Existente (IA)</button>
        <button class="btn btn-purple" id="generateBtn" onclick="generarDesdeFotos()">✨ 2. Generar Lista y Anuncios desde Fotos (IA)</button>
    </div>

    <div id="loadingOverlay">
        <span id="loadingText">Iniciando proceso...</span>
    </div>

    <div class="card" id="exportSection" style="display:none; background:#f0fdf4; border-color:#16a34a;">
        <h3 style="margin-top:0; color:#16a34a;">¡Anuncios listos!</h3>
        <button class="btn btn-purple" onclick="regenerarTextosVisionTodos()">✨ Generar Textos IA para TODOS</button>
        <button class="btn btn-warning" onclick="regenerarTodosAntiSpam()">🔄 Variar TODOS AntiSpam</button>
        <button class="btn btn-success" onclick="exportarParaBot()">Exportar Datos para el Bot</button>
        <button class="btn-danger" onclick="limpiarTodosLosPrecios()">🗑️ Limpiar Todos los Precios</button>
    </div>

    <div id="searchContainer" style="display:none;">
        <input type="text" id="searchBar" placeholder="🔍 Buscar anuncio generado para editar o eliminar..." onkeyup="filtrarLista()">
    </div>
    
    <div id="resultsContainer"></div>
</div>

<script>
    const BASE_WORKER_URL = "https://whatsappseller.aivideoprime.workers.dev";
    
    let sessionToken = null;
    let userQuota = 0;
    
    let selectedFiles = [];
    let globalResults = []; 
    let lastSearchIndex = 0;

    // --- ALGORITMO DE COMPRESIÓN DE IMÁGENES ---
    async function procesarYComprimirImagen(file) {
        return new Promise((resolve) => {
            const sizeKB = file.size / 1024;
            const reader = new FileReader();
            
            reader.onload = (e) => {
                // Si pesa menos de 120 KB, se devuelve intacta
                if (sizeKB <= 180) return resolve(e.target.result);
                
                // Compresión iterativa para asegurar peso entre 5 y 85 KB
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    let width = img.width; 
                    let height = img.height;
                    const targetKB = 130; 
                    let quality = 0.9;
                    let compressedDataUrl = "";
                    
                    const tryCompress = () => {
                        canvas.width = width; 
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                        
                        // Estimar peso del base64 en KB
                        let currentKB = Math.round((compressedDataUrl.length - 22) * 3 / 4 / 1024);
                        
                        if (currentKB > targetKB && quality > 0.1) {
                            quality -= 0.1;
                            // Si bajando calidad no basta, reducimos resolución
                            if (quality <= 0.3) { 
                                width *= 0.8; 
                                height *= 0.8; 
                                quality = 0.7; 
                            }
                            tryCompress();
                        } else {
                            resolve(compressedDataUrl);
                        }
                    };
                    tryCompress();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function iniciarSesion() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const btn = document.getElementById('btnLogin');
        const err = document.getElementById('loginError');
        
        if(!u || !p) { err.innerText = "Completa ambos campos."; return; }
        
        btn.disabled = true; btn.innerText = "Autenticando..."; err.innerText = "";
        
        try {
            const res = await fetch(`${BASE_WORKER_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            
            const data = await res.json();
            
            if(res.ok && data.success) {
                sessionToken = data.token;
                userQuota = data.cuota;
                document.getElementById('lblUsername').innerText = data.username;
                actualizarCuotaUI();
                
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'block';
            } else {
                err.innerText = data.error || "Error de autenticación.";
            }
        } catch(e) { err.innerText = "Error de conexión con el servidor."; }
        
        btn.disabled = false; btn.innerText = "Iniciar Sesión";
    }

    async function cerrarSesion() {
        if(sessionToken) {
            try {
                await fetch(`${BASE_WORKER_URL}/logout`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${sessionToken}` }
                });
            } catch(e) {}
        }
        sessionToken = null;
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appScreen').style.display = 'none';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }

    function actualizarCuotaUI() {
        document.getElementById('lblQuota').innerText = userQuota;
    }

    async function fetchProtegido(payload) {
        if(!sessionToken) { alert("Sesión inválida."); cerrarSesion(); throw new Error("No token"); }
        if(userQuota <= 0) { alert("Has agotado tu cuota. Contacta al administrador."); throw new Error("Cuota agotada"); }

        const response = await fetch(`${BASE_WORKER_URL}/publicar`, { 
            method: "POST", 
            headers: { 
                "Content-Type": "application/json",
                "Authorization": `Bearer ${sessionToken}`
            }, 
            body: JSON.stringify(payload) 
        });

        const data = await response.json();
        
        if(!response.ok) {
            if(response.status === 401 || response.status === 403) {
                alert(data.error);
                if(response.status === 401) cerrarSesion();
            }
            throw new Error(data.error || "Error en la petición protegida");
        }

        userQuota--;
        actualizarCuotaUI();
        return data;
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
        selectedFiles = Array.from(e.target.files);
        document.getElementById('fileLabel').textContent = `${selectedFiles.length} archivos seleccionados`;
    });

    const normalizarTexto = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    function importarJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (!Array.isArray(data)) throw new Error("Formato inválido.");
                
                globalResults = data.map((item, idx) => ({
                    id: idx, title: item.t || "", description: item.d || "", price: item.p || "", image: item.imgBase64 || null, deleted: false
                }));

                if (data.length > 0) {
                    if (data[0].ph) document.getElementById('telefono').value = data[0].ph;
                    if (data[0].pr) document.getElementById('provincia').value = data[0].pr;
                    if (data[0].mu) document.getElementById('municipio').value = data[0].mu;
                }

                document.getElementById('resultsContainer').innerHTML = "";
                document.getElementById('exportSection').style.display = 'block';
                document.getElementById('searchContainer').style.display = 'block';

                globalResults.forEach((item, idx) => renderizarTarjetaCompleta(idx, item, true));
                event.target.value = ""; 
            } catch (err) { alert("Error: " + err.message); }
        };
        reader.readAsText(file);
    }

    async function regenerarTextosVisionIndividual(idx) {
        const item = globalResults[idx];
        if (item.deleted || !item.image) return alert("Falta imagen o el anuncio está eliminado.");
        const overlay = document.getElementById('loadingOverlay');
        document.getElementById('loadingText').innerText = `Leyendo foto ${idx + 1}...`;
        overlay.style.display = 'block';

        try {
            const payload = { 
                action: "regenerar_textos_vision", image: item.image,
                limiteDesc: document.getElementById('limiteDesc').value,
                applyMarketing: document.getElementById('applyMarketing').checked
            };
            const data = await fetchProtegido(payload);
            if (data.success && data.results && data.results[0]) {
                document.getElementById(`t-${idx}`).value = data.results[0].title || "";
                document.getElementById(`d-${idx}`).value = data.results[0].description || "";
                const badge = document.getElementById(`badge-${idx}`);
                if(badge) { badge.textContent = "✨ Textos IA"; badge.className = "status-badge badge-vision"; }
            }
        } catch (error) { console.error(error); } finally { overlay.style.display = 'none'; }
    }

    async function regenerarTextosVisionTodos() {
        if(!confirm("¿Generar Título y Descripción con IA para TODOS? (1 cuota por imagen)")) return;
        for (let i = 0; i < globalResults.length; i++) {
            if (!globalResults[i].deleted && globalResults[i].image) {
                if(userQuota <= 0) break;
                await regenerarTextosVisionIndividual(i);
                await sleep(3500);
            }
        }
    }

    function generarHashUnicoImagenCanvas(base64Original) {
        return new Promise((resolve) => {
            if (!base64Original) return resolve(null);
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                let width = img.width, height = img.height;
                if (width > 1024) { height = Math.round((height * 1024) / width); width = 1024; }
                canvas.width = width; canvas.height = height;
                ctx.translate(canvas.width/2, canvas.height/2);
                ctx.rotate((Math.random() - 0.5) * 0.005); ctx.scale(1.005, 1.005); ctx.translate(-canvas.width/2, -canvas.height/2);
                ctx.drawImage(img, 0, 0, width, height);
                const imgData = ctx.getImageData(0, 0, 1, 1); imgData.data[0] = imgData.data[0] ^ 1; ctx.putImageData(imgData, 0, 0);
                resolve(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.src = base64Original;
        });
    }

    async function regenerarAntiSpamIndividual(idx) {
        const item = globalResults[idx];
        if (item.deleted) return;
        const overlay = document.getElementById('loadingOverlay');
        document.getElementById('loadingText').innerText = `Aplicando Anti-Spam ${idx + 1}...`;
        overlay.style.display = 'block';

        try {
            const newImageBase64 = await generarHashUnicoImagenCanvas(item.image);
            const payload = { 
                action: "regenerar_antispam", originalTitle: document.getElementById(`t-${idx}`).value,
                originalDesc: document.getElementById(`d-${idx}`).value,
                limiteDesc: document.getElementById('limiteDesc').value,
                applyMarketing: document.getElementById('applyMarketing').checked
            };
            const data = await fetchProtegido(payload);
            if (data.success && data.results && data.results[0]) {
                actualizarTarjetaProducto(idx, { image: newImageBase64 || item.image, title: data.results[0].title, description: data.results[0].description });
                const badge = document.getElementById(`badge-${idx}`);
                if(badge) { badge.textContent = "✨ Variante Anti-Spam"; badge.className = "status-badge badge-antispam"; }
            }
        } catch (error) { console.error(error); } finally { overlay.style.display = 'none'; }
    }

    async function regenerarTodosAntiSpam() {
        if(!confirm("¿Variar TODOS los anuncios Anti-Spam? (1 cuota por anuncio)")) return;
        for (let i = 0; i < globalResults.length; i++) {
            if (!globalResults[i].deleted) {
                if(userQuota <= 0) break;
                await regenerarAntiSpamIndividual(i);
                await sleep(2000); 
            }
        }
    }

    function buscarEnTexto() {
        const term = document.getElementById('preSearch').value.toLowerCase();
        const textarea = document.getElementById('rawProducts');
        if(!term) return;
        const text = textarea.value.toLowerCase();
        let idx = text.indexOf(term, lastSearchIndex);
        if(idx === -1) { idx = text.indexOf(term); if(idx === -1) return alert("No encontrado."); }
        textarea.focus(); textarea.setSelectionRange(idx, idx + term.length);
        lastSearchIndex = idx + term.length;
    }

    function removerDelTexto() {
        const term = normalizarTexto(document.getElementById('preSearch').value);
        if(!term) return;
        if(!confirm(`¿Eliminar "${term}"?`)) return;
        const textarea = document.getElementById('rawProducts');
        const lines = textarea.value.split('\n');
        let borradas = 0;
        const newLines = lines.filter(line => {
            if (line.trim() === '' || line.includes('$') || line.toLowerCase().includes('usd')) return true;
            if (normalizarTexto(line).includes(term)) { borradas++; return false; }
            return true;
        });
        if(borradas > 0) { textarea.value = newLines.join('\n'); alert(`Eliminados ${borradas}.`); document.getElementById('preSearch').value = ""; }
    }

    function filtrarLista() {
        const termino = normalizarTexto(document.getElementById('searchBar').value);
        document.querySelectorAll('.product-list-item').forEach(item => {
            if (item.dataset.deleted !== "true") item.style.display = normalizarTexto(item.querySelector('.search-title').value).includes(termino) ? 'flex' : 'none';
        });
    }

    function eliminarAnuncio(idx) {
        if(confirm("¿Eliminar anuncio?")) {
            document.getElementById(`item-container-${idx}`).style.display = 'none';
            document.getElementById(`item-container-${idx}`).dataset.deleted = "true";
            globalResults[idx].deleted = true;
        }
    }

    function limpiarTodosLosPrecios() {
        if(confirm("¿Vaciar precios?")) document.querySelectorAll('input[id^="p-"]').forEach(i => i.value = "");
    }

    function parsearInventarioConPrecios() {
        const text = document.getElementById('rawProducts').value;
        const lines = text.split('\n');
        let currentPrice = "", parsedList = [];
        lines.forEach(line => {
            const cleanLine = line.trim();
            if (!cleanLine) return;
            if (cleanLine.includes('$') || cleanLine.toLowerCase().includes('usd')) {
                const matchPrice = cleanLine.match(/[\d.]+/);
                if (matchPrice) currentPrice = matchPrice[0];
            } else parsedList.push({ name: cleanLine, price: currentPrice });
        });
        return parsedList;
    }

    function renderizarTarjetaCompleta(idx, item) {
        const container = document.getElementById('resultsContainer');
        const div = document.createElement('div');
        div.className = 'product-list-item ' + (item.image ? 'linked' : '');
        div.id = `item-container-${idx}`; div.dataset.deleted = "false";

        const imgContent = item.image ? `<img src="${item.image}" alt="Foto">` : `<div class="no-img-box">Sin foto</div>`;
        const badgeContent = item.image ? `<span class="status-badge badge-linked" id="badge-${idx}">🟢 Listo</span>` : `<span class="status-badge badge-pending" id="badge-${idx}">Pendiente</span>`;

        div.innerHTML = `
            <div class="img-container" id="img-box-${idx}">
                ${imgContent}
                <button class="btn-sm" style="background:#0284c7; padding:2px 6px; font-size:0.7rem;" onclick="document.getElementById('change-photo-${idx}').click()">📷 Cambiar</button>
                <input type="file" id="change-photo-${idx}" accept="image/*" style="display:none;" onchange="cambiarFotoManual(${idx}, this)">
            </div>
            <div class="product-details">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 5px;">
                    <div><label style="display:inline-block; margin-right:8px;">Título</label>${badgeContent}</div>
                    <div style="display:flex; gap: 5px; flex-wrap:wrap; justify-content:flex-end;">
                        <button class="btn-sm" style="background:#8b5cf6; padding:4px 8px;" onclick="regenerarTextosVisionIndividual(${idx})">✨ Textos IA</button>
                        <button class="btn-sm" style="background:#f59e0b; padding:4px 8px;" onclick="regenerarAntiSpamIndividual(${idx})">🔄 AntiSpam</button>
                        <button class="btn-sm" style="background:#ef4444; padding:4px 8px;" onclick="eliminarAnuncio(${idx})">🗑️ Eliminar</button>
                    </div>
                </div>
                <input type="text" class="search-title" id="t-${idx}" value="${item.title}">
                <div class="row-flex">
                    <div style="flex:1;"><label>Precio</label><input type="text" id="p-${idx}" value="${item.price || ''}"></div>
                    <div style="display:flex; gap:5px; margin-top:15px;">
                        <button class="btn-sm" onclick="document.getElementById('d-${idx}').value=''">Vaciar Desc.</button>
                        <button class="btn-sm" onclick="document.getElementById('d-${idx}').value=document.getElementById('t-${idx}').value">= Título</button>
                    </div>
                </div>
                <label>Descripción</label>
                <textarea id="d-${idx}" style="height: 60px;">${item.description}</textarea>
            </div>
        `;
        container.appendChild(div);
    }

    async function procesarAnuncios() {
        const inventory = parsearInventarioConPrecios();
        if (inventory.length === 0) return alert("Lista vacía");

        document.getElementById('resultsContainer').innerHTML = ""; globalResults = [];
        inventory.forEach((item, idx) => {
            globalResults.push({ id: idx, title: item.name, description: item.name, image: null, price: item.price, deleted: false });
            renderizarTarjetaCompleta(idx, globalResults[idx]);
        });

        document.getElementById('exportSection').style.display = 'block'; document.getElementById('searchContainer').style.display = 'block';
        if (selectedFiles.length === 0) return alert("Se muestra solo la estructura sin imágenes.");

        const overlay = document.getElementById('loadingOverlay');
        const processBtn = document.getElementById('processBtn');
        overlay.style.display = 'block'; processBtn.disabled = true;

        try {
            for (let i = 0; i < selectedFiles.length; i++) {
                if(userQuota <= 0) break;
                document.getElementById('loadingText').innerText = `Procesando imagen ${i + 1}...`;
                
                // --- COMPRESIÓN APLICADA AL LER LA FOTO ---
                const base64 = await procesarYComprimirImagen(selectedFiles[i]);
                
                const payload = { images: [base64], products: inventory.map(i => i.name), applyMarketing: document.getElementById('applyMarketing').checked, limiteDesc: document.getElementById('limiteDesc').value };
                const data = await fetchProtegido(payload);
                
                if (data.success && data.results) data.results.forEach((matchResult, matchedIdx) => { if (matchResult.image) actualizarTarjetaProducto(matchedIdx, matchResult); });
                if (i < selectedFiles.length - 1) await sleep(3000); 
            }
        } catch (err) { } finally { overlay.style.display = 'none'; processBtn.disabled = false; }
    }

    async function generarDesdeFotos() {
        if (selectedFiles.length === 0) return alert("Selecciona fotos primero.");
        const overlay = document.getElementById('loadingOverlay');
        overlay.style.display = 'block'; document.getElementById('resultsContainer').innerHTML = ""; globalResults = [];
        document.getElementById('exportSection').style.display = 'block'; document.getElementById('searchContainer').style.display = 'block';

        try {
            for (let i = 0; i < selectedFiles.length; i++) {
                if(userQuota <= 0) break;
                document.getElementById('loadingText').innerText = `Generando producto ${i + 1}...`;
                
                // --- COMPRESIÓN APLICADA AL LER LA FOTO ---
                const base64 = await procesarYComprimirImagen(selectedFiles[i]);
                
                const payload = { images: [base64], products: [], applyMarketing: document.getElementById('applyMarketing').checked, limiteDesc: document.getElementById('limiteDesc').value };
                const data = await fetchProtegido(payload);
                
                if (data.success && data.results && data.results.length > 0) {
                    const item = data.results[0];
                    const newIdx = globalResults.length;
                    globalResults.push({ id: newIdx, title: item.title, description: item.description, image: item.image, price: "", deleted: false });
                    renderizarTarjetaCompleta(newIdx, globalResults[newIdx]);
                }
                if (i < selectedFiles.length - 1) await sleep(3000); 
            }
        } catch (err) { } finally { overlay.style.display = 'none'; }
    }

    function actualizarTarjetaProducto(idx, matchData) {
        globalResults[idx].image = matchData.image; globalResults[idx].title = matchData.title || globalResults[idx].title; globalResults[idx].description = matchData.description || globalResults[idx].description;
        const card = document.getElementById(`item-container-${idx}`); const imgBox = document.getElementById(`img-box-${idx}`); const badge = document.getElementById(`badge-${idx}`);
        if (card) card.classList.add('linked');
        if (imgBox && matchData.image) {
            imgBox.querySelector('.no-img-box')?.remove(); imgBox.querySelector('img')?.remove();
            const newImg = document.createElement('img'); newImg.src = matchData.image; imgBox.insertBefore(newImg, imgBox.firstChild);
        }
        if (badge) { badge.textContent = "🟢 IA"; badge.className = "status-badge badge-linked"; }
        if (matchData.title) document.getElementById(`t-${idx}`).value = matchData.title;
        if (matchData.description) document.getElementById(`d-${idx}`).value = matchData.description;
    }

    async function cambiarFotoManual(idx, inputElement) {
        if (!inputElement.files || !inputElement.files[0]) return;
        
        // --- COMPRESIÓN APLICADA A FOTOS CAMBIADAS MANUALMENTE ---
        const base64 = await procesarYComprimirImagen(inputElement.files[0]);
        
        actualizarTarjetaProducto(idx, { image: base64, title: document.getElementById(`t-${idx}`).value, description: document.getElementById(`d-${idx}`).value });
        document.getElementById(`badge-${idx}`).textContent = "🔵 Manual";
    }

    function exportarParaBot() {
        const provincia = document.getElementById('provincia').value; const municipio = document.getElementById('municipio').value; const telefono = document.getElementById('telefono').value;
        const datosFinales = globalResults.filter(item => !item.deleted).map((item, idx) => ({
            i: 'id_' + idx, t: document.getElementById(`t-${item.id}`).value, d: document.getElementById(`d-${item.id}`).value, p: document.getElementById(`p-${item.id}`).value,
            ph: telefono, pr: provincia, mu: municipio, imgBase64: item.image
        }));
        if (datosFinales.length === 0) return alert("No hay anuncios para exportar.");
        const anchor = document.createElement('a'); anchor.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(datosFinales)));
        anchor.setAttribute("download", "datos_bot_revolico.json"); document.body.appendChild(anchor); anchor.click(); anchor.remove();
    }
    
    window.addEventListener('beforeunload', function (e) { e.preventDefault(); e.returnValue = ''; });
</script>
</body>
</html>
