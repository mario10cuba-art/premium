<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Masivo de Anuncios v7 - Textos IA & Optimizaci贸n</title>
    <style>
        :root {
            --primary: #0284c7; --primary-dark: #0369a1; --accent: #f59e0b;
            --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1;
        }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); padding: 16px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
        .btn { background-color: var(--primary); color: white; border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-bottom: 8px; }
        .btn:active { background-color: var(--primary-dark); }
        .btn-success { background-color: #16a34a; }
        .btn-purple { background-color: #8b5cf6; }
        .btn-purple:hover { background-color: #7c3aed; }
        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-danger { background-color: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 10px; }
        .btn-sm { padding: 6px 10px; font-size: 0.8rem; background: #475569; color: white; border: none; border-radius: 4px; cursor: pointer; }
        input[type="file"] { display: none; }
        .file-upload-btn { background-color: #e0f2fe; color: var(--primary-dark); border: 2px dashed var(--primary); padding: 16px; border-radius: 8px; text-align: center; font-weight: 600; display: block; cursor: pointer; margin-bottom: 8px; }
        .file-import-btn { background-color: #fef08a; color: #854d0e; border: 2px dashed #eab308; padding: 10px; border-radius: 8px; text-align: center; font-weight: 600; display: block; cursor: pointer; margin-bottom: 16px; }
        textarea, input[type="text"], input[type="number"] { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; margin-top: 4px; margin-bottom: 8px; }
        label { font-size: 0.85rem; font-weight: 700; color: #475569; display: block; }
        
        .product-list-item { display: flex; gap: 15px; background: white; border-radius: 8px; border: 1px solid #e2e8f0; padding: 12px; margin-bottom: 12px; align-items: flex-start; transition: all 0.3s ease; }
        .product-list-item.linked { border-color: #16a34a; background-color: #f0fdf4; }
        
        .img-container { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
        .product-list-item img { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; background: #f1f5f9; }
        .no-img-box { width: 90px; height: 90px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 10px; text-align: center; border-radius: 6px; color: #64748b; }
        
        .product-details { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }
        .row-flex { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        #loadingOverlay { display: none; text-align: center; padding: 15px; font-weight: 600; color: var(--primary-dark); background: #e0f2fe; border-radius: 8px; margin-bottom: 16px; border: 2px solid var(--primary); }
        #searchBar { border: 2px solid var(--primary); padding: 10px; font-size: 16px; font-weight: bold; width: 100%; box-sizing: border-box; margin-bottom: 15px; }
        
        .pre-search-container { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; }
        .pre-search-container input { margin: 0; flex: 1; }
        .status-badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-pending { background: #e2e8f0; color: #475569; }
        .badge-linked { background: #dcfce7; color: #15803d; }
        .badge-antispam { background: #fef08a; color: #854d0e; }
        .badge-vision { background: #e0e7ff; color: #4338ca; }
    </style>
</head>
<body>
<div class="container">

    <!-- CABECERA PRINCIPAL CON LOGO Y DONACIONES -->
    <div class="card" style="margin-bottom: 16px; border-color: #0284c7;">
        <div style="display:flex; flex-direction:column; gap:10px; box-sizing:border-box;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <img src="https://i.postimg.cc/JzNwmDrB/photostudio-1789810734924.jpg" alt="SHEKINAHIA Logo" style="height:48px; width:auto; max-width:180px; object-fit:contain; border-radius:6px;">
                <div style="display:flex; align-items:center; gap:6px;">
                    <span style="background:#e0f2fe; color:#0369a1; font-size:12px; font-weight:bold; padding:4px 10px; border-radius:6px; border:1px solid rgba(2,132,199,0.2);">
                        馃 Gestor Masivo 馃敟
                    </span>
                </div>
            </div>
            
            <!-- Bloque de Donaciones CUP -->
            <div style="background:#f0fdf4; color:#166534; font-size:11px; font-weight:600; padding:8px 12px; border-radius:8px; border:1px solid #bbf7d0; text-align:center; word-break:break-word;">
                馃挸 <b>Donaciones CUP:</b> 9227-9598-7218-2212
            </div>
        </div>
    </div>

    <h2>Gestor Masivo de Anuncios</h2>
    <div class="card">
        
        <label class="file-import-btn" for="importJsonInput">馃搨 Importar JSON Previamente Exportado</label>
        <input type="file" id="importJsonInput" accept=".json" onchange="importarJSON(event)">

        <label>Subir Fotos Nuevas</label>
        <label for="fileInput" class="file-upload-btn" id="fileLabel">Elegir archivos (0 seleccionados)</label>
        <input type="file" id="fileInput" multiple accept="image/*">
        
        <label style="margin-top: 12px;">Lista de Productos con Precios (Opcional si generas desde fotos)</label>
        
        <div class="pre-search-container">
            <input type="text" id="preSearch" placeholder="Ej. Acetaminofen (Busca o elimina de la lista)">
            <button class="btn-sm" style="background:var(--primary);" onclick="buscarEnTexto()">馃攳 Buscar</button>
            <button class="btn-sm" style="background:#ef4444;" onclick="removerDelTexto()">馃棏锔� Eliminar</button>
        </div>
        
        <textarea id="rawProducts" style="height:120px;">$ 2.50 USD :
Gel Analg茅sico Oral
Alivio Urinario (8 tabletas)</textarea>

        <div style="margin-top: 6px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="applyMarketing" style="width: 18px; height: 18px; cursor: pointer; margin: 0;">
            <label for="applyMarketing" style="margin: 0; cursor: pointer; font-size: 0.85rem;">Aplicar regla de marketing a los t铆tulos generados</label>
        </div>

        <div>
            <label>L铆mite de caracteres para descripciones (Vac铆o = Sin l铆mite)</label>
            <input type="number" id="limiteDesc" placeholder="Ej. 300">
        </div>

        <div class="grid-2">
            <div><label>Provincia</label><input type="text" id="provincia" value="La Habana"></div>
            <div><label>Municipio</label><input type="text" id="municipio" value="Arroyo Naranjo"></div>
            <div><label>Tel茅fono</label><input type="number" id="telefono" placeholder="Ej. 55555555" value="59217208"></div>
        </div>

        <button class="btn" id="processBtn" onclick="procesarAnuncios()">1. Vincular Fotos a Lista Existente (IA)</button>
        <button class="btn btn-purple" id="generateBtn" onclick="generarDesdeFotos()">鉁� 2. Generar Lista y Anuncios desde Fotos (IA)</button>
    </div>

    <div id="loadingOverlay">
        <span id="loadingText">Iniciando proceso...</span>
    </div>

    <div class="card" id="exportSection" style="display:none; background:#f0fdf4; border-color:#16a34a;">
        <h3 style="margin-top:0; color:#16a34a;">隆Anuncios listos!</h3>
        <button class="btn btn-purple" onclick="regenerarTextosVisionTodos()">鉁� Generar Textos IA para TODOS (Lectura de fotos)</button>
        <button class="btn btn-warning" onclick="regenerarTodosAntiSpam()">馃攧 Variar TODOS para evitar Spam (Fotos, T铆tulo, Desc)</button>
        <button class="btn btn-success" onclick="exportarParaBot()">Exportar Datos para el Bot de Revolico</button>
        <button class="btn-danger" onclick="limpiarTodosLosPrecios()">馃棏锔� Limpiar Todos los Precios</button>
    </div>

    <div id="searchContainer" style="display:none;">
        <input type="text" id="searchBar" placeholder="馃攳 Buscar anuncio generado para editar o eliminar..." onkeyup="filtrarLista()">
    </div>
    
    <div id="resultsContainer"></div>
</div>

<script>
    const WORKER_URL = "https://whatsappseller.aivideoprime.workers.dev/publicar";
    let selectedFiles = [];
    let globalResults = []; 
    let lastSearchIndex = 0;

    document.getElementById('fileInput').addEventListener('change', (e) => {
        selectedFiles = Array.from(e.target.files);
        document.getElementById('fileLabel').textContent = `${selectedFiles.length} archivos seleccionados`;
    });

    const normalizarTexto = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    function importarJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (!Array.isArray(data)) throw new Error("Formato inv谩lido.");
                
                globalResults = data.map((item, idx) => ({
                    id: idx,
                    title: item.t || "",
                    description: item.d || "",
                    price: item.p || "",
                    image: item.imgBase64 || null,
                    deleted: false
                }));

                if (data.length > 0) {
                    if (data[0].ph) document.getElementById('telefono').value = data[0].ph;
                    if (data[0].pr) document.getElementById('provincia').value = data[0].pr;
                    if (data[0].mu) document.getElementById('municipio').value = data[0].mu;
                }

                document.getElementById('resultsContainer').innerHTML = "";
                document.getElementById('exportSection').style.display = 'block';
                document.getElementById('searchContainer').style.display = 'block';

                globalResults.forEach((item, idx) => renderizarTarjetaCompleta(idx, item, true));
                
                alert("JSON Importado Correctamente.");
                event.target.value = ""; 
            } catch (err) { alert("Error: " + err.message); }
        };
        reader.readAsText(file);
    }

    async function regenerarTextosVisionIndividual(idx) {
        const item = globalResults[idx];
        if (item.deleted || !item.image) return alert("Falta imagen o el anuncio est谩 eliminado.");

        const overlay = document.getElementById('loadingOverlay');
        document.getElementById('loadingText').innerText = `Leyendo foto ${idx + 1} para generar textos...`;
        overlay.style.display = 'block';

        try {
            const limiteDesc = document.getElementById('limiteDesc').value;
            const applyMarketing = document.getElementById('applyMarketing').checked;
            
            const payload = { 
                action: "regenerar_textos_vision",
                image: item.image,
                limiteDesc: limiteDesc,
                applyMarketing: applyMarketing
            };

            const response = await fetch(WORKER_URL, { 
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) 
            });

            const data = await response.json();

            if (data.success && data.results && data.results[0]) {
                const aiResult = data.results[0];
                document.getElementById(`t-${idx}`).value = aiResult.title || "";
                document.getElementById(`d-${idx}`).value = aiResult.description || "";
                
                const badge = document.getElementById(`badge-${idx}`);
                if(badge) {
                    badge.textContent = "鉁� Textos IA";
                    badge.className = "status-badge badge-vision";
                }
            } else { throw new Error("No se pudo obtener textos"); }
        } catch (error) {
            console.error(error);
            alert("Error al generar textos para el anuncio " + (idx + 1));
        } finally { overlay.style.display = 'none'; }
    }

    async function regenerarTextosVisionTodos() {
        if(!confirm("驴Generar T铆tulo y Descripci贸n con IA para TODOS los anuncios bas谩ndose en sus fotos actuales? (Tomar谩 unos segundos por imagen)")) return;
        
        for (let i = 0; i < globalResults.length; i++) {
            if (!globalResults[i].deleted && globalResults[i].image) {
                await regenerarTextosVisionIndividual(i);
                await sleep(3500);
            }
        }
        alert("Generaci贸n de textos completada.");
    }

    function generarHashUnicoImagenCanvas(base64Original) {
        return new Promise((resolve) => {
            if (!base64Original) return resolve(null);
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                const MAX_WIDTH = 1024;
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH) {
                    height = Math.round((height * MAX_WIDTH) / width);
                    width = MAX_WIDTH;
                }

                canvas.width = width; 
                canvas.height = height;
                
                ctx.translate(canvas.width/2, canvas.height/2);
                ctx.rotate((Math.random() - 0.5) * 0.005); 
                ctx.scale(1.005, 1.005); 
                ctx.translate(-canvas.width/2, -canvas.height/2);
                ctx.drawImage(img, 0, 0, width, height);
                
                const imgData = ctx.getImageData(0, 0, 1, 1);
                imgData.data[0] = imgData.data[0] ^ 1; 
                ctx.putImageData(imgData, 0, 0);
                
                resolve(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.src = base64Original;
        });
    }

    async function regenerarAntiSpamIndividual(idx) {
        const item = globalResults[idx];
        if (item.deleted) return;

        const overlay = document.getElementById('loadingOverlay');
        document.getElementById('loadingText').innerText = `Aplicando Anti-Spam a elemento ${idx + 1}...`;
        overlay.style.display = 'block';

        try {
            const newImageBase64 = await generarHashUnicoImagenCanvas(item.image);
            const limiteDesc = document.getElementById('limiteDesc').value;
            const applyMarketing = document.getElementById('applyMarketing').checked;
            
            const payload = { 
                action: "regenerar_antispam",
                originalTitle: document.getElementById(`t-${idx}`).value,
                originalDesc: document.getElementById(`d-${idx}`).value,
                limiteDesc: limiteDesc,
                applyMarketing: applyMarketing
            };

            const response = await fetch(WORKER_URL, { 
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) 
            });

            const data = await response.json();

            if (data.success && data.results && data.results[0]) {
                const aiResult = data.results[0];
                actualizarTarjetaProducto(idx, { image: newImageBase64 || item.image, title: aiResult.title, description: aiResult.description });
                const badge = document.getElementById(`badge-${idx}`);
                if(badge) { badge.textContent = "鉁� Variante Anti-Spam"; badge.className = "status-badge badge-antispam"; }
            }
        } catch (error) { console.error(error); } 
        finally { overlay.style.display = 'none'; }
    }

    async function regenerarTodosAntiSpam() {
        if(!confirm("Esto modificar谩 ligeramente las fotos y reescribir谩 textos de todos los anuncios para evadir Spam. 驴Continuar?")) return;
        for (let i = 0; i < globalResults.length; i++) {
            if (!globalResults[i].deleted) {
                await regenerarAntiSpamIndividual(i);
                await sleep(2000); 
            }
        }
        alert("Variaciones Anti-Spam completadas.");
    }

    function buscarEnTexto() {
        const term = document.getElementById('preSearch').value.toLowerCase();
        const textarea = document.getElementById('rawProducts');
        if(!term) return;
        const text = textarea.value.toLowerCase();
        let idx = text.indexOf(term, lastSearchIndex);
        if(idx === -1) { idx = text.indexOf(term); if(idx === -1) return alert("No encontrado."); }
        textarea.focus(); textarea.setSelectionRange(idx, idx + term.length);
        lastSearchIndex = idx + term.length;
    }

    function removerDelTexto() {
        const term = normalizarTexto(document.getElementById('preSearch').value);
        if(!term) return;
        if(!confirm(`驴Eliminar "${term}"?`)) return;
        const textarea = document.getElementById('rawProducts');
        const lines = textarea.value.split('\n');
        let borradas = 0;
        const newLines = lines.filter(line => {
            if (line.trim() === '' || line.includes('$') || line.toLowerCase().includes('usd')) return true;
            if (normalizarTexto(line).includes(term)) { borradas++; return false; }
            return true;
        });
        if(borradas > 0) { textarea.value = newLines.join('\n'); alert(`Eliminados ${borradas}.`); document.getElementById('preSearch').value = ""; }
    }

    function filtrarLista() {
        const termino = normalizarTexto(document.getElementById('searchBar').value);
        document.querySelectorAll('.product-list-item').forEach(item => {
            if (item.dataset.deleted !== "true") item.style.display = normalizarTexto(item.querySelector('.search-title').value).includes(termino) ? 'flex' : 'none';
        });
    }

    function eliminarAnuncio(idx) {
        if(confirm("驴Eliminar anuncio?")) {
            document.getElementById(`item-container-${idx}`).style.display = 'none';
            document.getElementById(`item-container-${idx}`).dataset.deleted = "true";
            globalResults[idx].deleted = true;
        }
    }

    function limpiarTodosLosPrecios() {
        if(confirm("驴Vaciar precios?")) document.querySelectorAll('input[id^="p-"]').forEach(i => i.value = "");
    }

    function parsearInventarioConPrecios() {
        const text = document.getElementById('rawProducts').value;
        const lines = text.split('\n');
        let currentPrice = "", parsedList = [];
        lines.forEach(line => {
            const cleanLine = line.trim();
            if (!cleanLine) return;
            if (cleanLine.includes('$') || cleanLine.toLowerCase().includes('usd')) {
                const matchPrice = cleanLine.match(/[\d.]+/);
                if (matchPrice) currentPrice = matchPrice[0];
            } else parsedList.push({ name: cleanLine, price: currentPrice });
        });
        return parsedList;
    }

    function renderizarTarjetaCompleta(idx, item, isImport = false) {
        const container = document.getElementById('resultsContainer');
        const div = document.createElement('div');
        div.className = 'product-list-item ' + (item.image ? 'linked' : '');
        div.id = `item-container-${idx}`;
        div.dataset.deleted = "false";

        const imgContent = item.image ? `<img src="${item.image}" alt="Foto">` : `<div class="no-img-box">Sin foto</div>`;
        const badgeContent = item.image ? `<span class="status-badge badge-linked" id="badge-${idx}">馃煝 Listo</span>` : `<span class="status-badge badge-pending" id="badge-${idx}">Pendiente</span>`;

        div.innerHTML = `
            <div class="img-container" id="img-box-${idx}">
                ${imgContent}
                <button class="btn-sm" style="background:#0284c7; padding:2px 6px; font-size:0.7rem;" onclick="document.getElementById('change-photo-${idx}').click()">馃摲 Cambiar</button>
                <input type="file" id="change-photo-${idx}" accept="image/*" style="display:none;" onchange="cambiarFotoManual(${idx}, this)">
            </div>
            <div class="product-details">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 5px;">
                    <div>
                        <label style="display:inline-block; margin-right:8px;">T铆tulo</label>
                        ${badgeContent}
                    </div>
                    <div style="display:flex; gap: 5px; flex-wrap:wrap; justify-content:flex-end;">
                        <button class="btn-sm" style="background:#8b5cf6; padding:4px 8px;" onclick="regenerarTextosVisionIndividual(${idx})">鉁� Textos IA</button>
                        <button class="btn-sm" style="background:#f59e0b; padding:4px 8px;" onclick="regenerarAntiSpamIndividual(${idx})">馃攧 AntiSpam</button>
                        <button class="btn-sm" style="background:#ef4444; padding:4px 8px;" onclick="eliminarAnuncio(${idx})">馃棏锔� Eliminar</button>
                    </div>
                </div>
                <input type="text" class="search-title" id="t-${idx}" value="${item.title}">
                
                <div class="row-flex">
                    <div style="flex:1;">
                        <label>Precio</label>
                        <input type="text" id="p-${idx}" value="${item.price || ''}">
                    </div>
                    <div style="display:flex; gap:5px; margin-top:15px;">
                        <button class="btn-sm" onclick="document.getElementById('d-${idx}').value=''">Vaciar Desc.</button>
                        <button class="btn-sm" onclick="document.getElementById('d-${idx}').value=document.getElementById('t-${idx}').value">= T铆tulo</button>
                    </div>
                </div>

                <label>Descripci贸n</label>
                <textarea id="d-${idx}" style="height: 60px;">${item.description}</textarea>
            </div>
        `;
        container.appendChild(div);
    }

    async function procesarAnuncios() {
        const inventory = parsearInventarioConPrecios();
        if (inventory.length === 0) return alert("Lista vac铆a");

        document.getElementById('resultsContainer').innerHTML = "";
        globalResults = [];
        inventory.forEach((item, idx) => {
            globalResults.push({ id: idx, title: item.name, description: item.name, image: null, price: item.price, deleted: false });
            renderizarTarjetaCompleta(idx, globalResults[idx]);
        });

        document.getElementById('exportSection').style.display = 'block';
        document.getElementById('searchContainer').style.display = 'block';

        const overlay = document.getElementById('loadingOverlay');
        const processBtn = document.getElementById('processBtn');
        const applyMarketing = document.getElementById('applyMarketing').checked;
        const limiteDesc = document.getElementById('limiteDesc').value;
        
        overlay.style.display = 'block'; processBtn.disabled = true;

        if (selectedFiles.length === 0) {
            overlay.style.display = 'none'; processBtn.disabled = false; return alert("No seleccionaste im谩genes, se muestra solo la estructura.");
        }

        try {
            for (let i = 0; i < selectedFiles.length; i++) {
                document.getElementById('loadingText').innerText = `Analizando imagen ${i + 1}...`;
                const base64 = await new Promise((res, rej) => {
                    const reader = new FileReader(); reader.onload = () => res(reader.result); reader.readAsDataURL(selectedFiles[i]);
                });
                const payload = { images: [base64], products: inventory.map(i => i.name), applyMarketing, limiteDesc };
                const resp = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                const data = await resp.json();
                if (data.success && data.results) data.results.forEach((matchResult, matchedIdx) => { if (matchResult.image) actualizarTarjetaProducto(matchedIdx, matchResult); });
                if (i < selectedFiles.length - 1) await sleep(3000); 
            }
        } catch (err) { alert("Error al vincular."); } finally { overlay.style.display = 'none'; processBtn.disabled = false; }
    }

    async function generarDesdeFotos() {
        if (selectedFiles.length === 0) return alert("Selecciona fotos primero.");
        const overlay = document.getElementById('loadingOverlay');
        const applyMarketing = document.getElementById('applyMarketing').checked;
        const limiteDesc = document.getElementById('limiteDesc').value;

        overlay.style.display = 'block';
        document.getElementById('resultsContainer').innerHTML = "";
        globalResults = [];
        document.getElementById('exportSection').style.display = 'block';
        document.getElementById('searchContainer').style.display = 'block';

        try {
            for (let i = 0; i < selectedFiles.length; i++) {
                document.getElementById('loadingText').innerText = `Generando producto ${i + 1}...`;
                const base64 = await new Promise((res, rej) => {
                    const reader = new FileReader(); reader.onload = () => res(reader.result); reader.readAsDataURL(selectedFiles[i]);
                });
                const payload = { images: [base64], products: [], applyMarketing, limiteDesc };
                const resp = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                const data = await resp.json();
                if (data.success && data.results && data.results.length > 0) {
                    const item = data.results[0];
                    const newIdx = globalResults.length;
                    globalResults.push({ id: newIdx, title: item.title, description: item.description, image: item.image, price: "", deleted: false });
                    renderizarTarjetaCompleta(newIdx, globalResults[newIdx]);
                }
                if (i < selectedFiles.length - 1) await sleep(3000); 
            }
        } catch (err) { alert("Error al generar."); } finally { overlay.style.display = 'none'; }
    }

    function actualizarTarjetaProducto(idx, matchData) {
        globalResults[idx].image = matchData.image;
        globalResults[idx].title = matchData.title || globalResults[idx].title;
        globalResults[idx].description = matchData.description || globalResults[idx].description;

        const card = document.getElementById(`item-container-${idx}`);
        const imgBox = document.getElementById(`img-box-${idx}`);
        const badge = document.getElementById(`badge-${idx}`);
        
        if (card) card.classList.add('linked');
        
        if (imgBox && matchData.image) {
            imgBox.querySelector('.no-img-box')?.remove();
            imgBox.querySelector('img')?.remove();
            const newImg = document.createElement('img'); newImg.src = matchData.image; imgBox.insertBefore(newImg, imgBox.firstChild);
        }
        if (badge) { badge.textContent = "馃煝 IA"; badge.className = "status-badge badge-linked"; }
        if (matchData.title) document.getElementById(`t-${idx}`).value = matchData.title;
        if (matchData.description) document.getElementById(`d-${idx}`).value = matchData.description;
    }

    function cambiarFotoManual(idx, inputElement) {
        if (!inputElement.files || !inputElement.files[0]) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            actualizarTarjetaProducto(idx, { image: e.target.result, title: document.getElementById(`t-${idx}`).value, description: document.getElementById(`d-${idx}`).value });
            document.getElementById(`badge-${idx}`).textContent = "馃數 Manual";
        };
        reader.readAsDataURL(inputElement.files[0]);
    }

    function exportarParaBot() {
        const provincia = document.getElementById('provincia').value;
        const municipio = document.getElementById('municipio').value;
        const telefono = document.getElementById('telefono').value;
        const datosFinales = globalResults.filter(item => !item.deleted).map((item, idx) => ({
            i: 'id_' + idx,
            t: document.getElementById(`t-${item.id}`).value,
            d: document.getElementById(`d-${item.id}`).value,
            p: document.getElementById(`p-${item.id}`).value,
            ph: telefono,
            pr: provincia,
            mu: municipio,
            imgBase64: item.image
        }));
        if (datosFinales.length === 0) return alert("No hay anuncios para exportar.");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(datosFinales));
        const anchor = document.createElement('a'); anchor.setAttribute("href", dataStr); anchor.setAttribute("download", "datos_bot_revolico.json");
        document.body.appendChild(anchor); anchor.click(); anchor.remove();
    }
</script>
